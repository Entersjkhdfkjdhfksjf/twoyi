name: build-rootfs

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Target Android API level (29 = Android 10)'
        default: '29'
        required: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full android-sdk-libsparse-utils unzip rsync file xxd erofs-utils openjdk-17-jre-headless

      # rootfs.7z is ~200MB — over GitHub's 100MB plain-git push limit —
      # so it's pulled from your fork's Release asset instead of being
      # committed to the repo.
      - name: Fetch base twoyi rootfs
        run: |
          curl -L -o rootfs.7z "https://github.com/Entersjkhdfkjdhfksjf/twoyi/releases/download/Resources/rootfs.7z"

          # 7z exits 2 whenever it drops a "dangerous" symlink on extraction
          # (the 8 known ones fixed in the next step) — that's expected here,
          # not a real failure, so don't let it kill the step under `bash -e`.
          7z x -y rootfs.7z -o./base || true

          # Real sanity check instead: a corrupted download or wrong archive
          # should still fail the job loudly. init is a plain file, not a
          # symlink, so its presence confirms extraction actually ran.
          test -f base/rootfs/init || { echo "::error::rootfs extraction failed — base/rootfs/init missing"; exit 1; }

      # p7zip's extractor refuses to write symlinks it considers "dangerous"
      # (absolute targets, or relative targets that look like they escape
      # the destination dir) even though they're valid once this tree
      # becomes an actual root filesystem. It silently skips them rather
      # than failing the job, so recreate them explicitly. This exact list
      # came from the "Dangerous link path was ignored" warnings 7z printed
      # on the original rootfs.7z.
      - name: Restore symlinks p7zip drops on extraction
        run: |
          cd base/rootfs
          ln -sf /sbin/charger charger
          ln -sf ../init sbin/ueventd
          ln -sf ../init sbin/watchdogd
          ln -sf /system/lib64/libbluetooth_jni.so system/app/Bluetooth/lib/arm64/libbluetooth_jni.so
          ln -sf /system/lib64/libcups.so system/app/BuiltInPrintService/lib/arm64/libcups.so
          ln -sf /system/lib64/libwfds.so system/app/BuiltInPrintService/lib/arm64/libwfds.so
          ln -sf /system/lib64/libjni_latinime.so system/app/LatinIME/lib/arm64/libjni_latinime.so
          ln -sf /system/lib64/libdefcontainer_jni.so system/priv-app/DefaultContainerService/lib/arm64/libdefcontainer_jni.so
          cd -

      - name: Install sdkmanager and fetch target Android arm64 system image
        run: |
          curl -L -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d cmdline-tools
          yes | ./cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$PWD/sdk --licenses
          ./cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$PWD/sdk \
            "system-images;android-${{ github.event.inputs.api_level }};google_apis;arm64-v8a"

      # Don't assume sparse format — sdkmanager's emulator images are
      # typically already plain raw ext4, unlike device factory/OTA
      # images. This is almost certainly why simg2img failed with
      # "Invalid sparse file format at header magic" last run.
      - name: Inspect and convert images if needed
        run: |
          IMG=sdk/system-images/android-${{ github.event.inputs.api_level }}/google_apis/arm64-v8a
          echo "--- image formats ---"
          file "$IMG/system.img"
          file "$IMG/vendor.img"

          convert_if_sparse() {
            local infile=$1 outfile=$2
            if file "$infile" | grep -qi "sparse"; then
              echo "Sparse image detected, converting: $infile"
              simg2img "$infile" "$outfile"
            else
              echo "Already raw, copying: $infile"
              cp "$infile" "$outfile"
            fi
          }

          convert_if_sparse "$IMG/system.img" system.raw.img
          convert_if_sparse "$IMG/vendor.img" vendor.raw.img

      - name: Fetch lpunpack (pure-Python super.img extractor, no device-mapper needed)
        run: curl -L -o lpunpack.py "https://raw.githubusercontent.com/unix3dgforce/lpunpack/master/lpunpack.py"

      - name: Merge into twoyi rootfs layout
        run: |
          echo "--- diagnosing raw images before mount ---"
          file system.raw.img
          file vendor.raw.img

          mkdir -p mnt_sys mnt_vendor extracted_sys extracted_vendor
          declare -a LOOPDEVS

          # system.raw.img/vendor.raw.img turned out to be full GPT disk
          # images containing "vbmeta" (verified-boot signatures, not
          # filesystem data — ignore it) and "super" (Android's dynamic-
          # partition container, introduced as mandatory in Android 10 —
          # explains why this showed up right at API 29). super isn't a
          # filesystem itself; it holds logical partitions packed together
          # via LP metadata, which lpunpack.py extracts directly.
          extract_super() {
            local img=$1 outdir=$2
            local loopdev part superpart=""
            loopdev=$(sudo losetup -f -P --show "$img")
            LOOPDEVS+=("$loopdev")
            echo "$img attached as $loopdev"

            for part in "${loopdev}"p*; do
              [ -b "$part" ] || continue
              if sudo blkid "$part" | grep -q 'PARTLABEL="super"'; then
                superpart="$part"
              fi
            done

            if [ -z "$superpart" ]; then
              echo "::error::No 'super' partition found in $img"
              for part in "${loopdev}"p*; do sudo blkid "$part" || true; done
              exit 1
            fi
            echo "Found super partition: $superpart"

            echo "--- super partition contents ---"
            sudo python3 lpunpack.py --info "$superpart" || true

            sudo python3 lpunpack.py "$superpart" "$outdir"
            echo "--- extracted from $superpart ---"
            ls -la "$outdir"
          }

          extract_super system.raw.img extracted_sys
          # vendor.raw.img isn't a super container at all (blkid showed a
          # plain ext4 "vendor" partition directly) — it's a redundant
          # standalone copy of the same vendor content already extracted
          # from system.raw.img's super above, so there's nothing further
          # to do with it.

          # lpunpack output files are plain ext4/erofs images (no further
          # partition wrapping) — mount directly.
          mount_extracted() {
            local f=$1 dest=$2
            echo "Mounting $f"
            if ! sudo mount -t ext4 -o ro "$f" "$dest" 2>/tmp/mounterr \
              && ! sudo mount -t erofs -o ro "$f" "$dest" 2>>/tmp/mounterr; then
              echo "::error::Could not mount $f as ext4 or erofs"
              cat /tmp/mounterr
              sudo dmesg | tail -30
              exit 1
            fi
          }

          mount_extracted extracted_sys/system.img mnt_sys
          mount_extracted extracted_sys/vendor.img mnt_vendor

          # Keep twoyi's own scaffolding (init.superuser.rc, rom.ini,
          # sepolicy, *_contexts, init.goldfish.rc/fstab.goldfish for the
          # 10.0.2.x networking) and replace everything under
          # rootfs/system/ with the new build's content.
          sudo rsync -a --delete mnt_sys/ base/rootfs/system/
          sudo rsync -a mnt_vendor/ base/rootfs/system/vendor/

          sudo umount mnt_sys mnt_vendor
          for d in "${LOOPDEVS[@]}"; do sudo losetup -d "$d"; done

      # -snl stores symlinks as symlinks instead of dereferencing them
      # into copies. If your installed 7z build rejects this flag, check
      # `7z --help` for the equivalent on that version before dropping it —
      # without it you'll silently re-lose the same symlinks fixed above.
      - name: Repackage
        run: |
          cd base
          sudo 7z a -mx=9 -snl ../custom_rootfs.7z rootfs/
          sudo chown "$(id -u)":"$(id -g)" ../custom_rootfs.7z

      - uses: actions/upload-artifact@v4
        with:
          name: custom-rootfs
          path: custom_rootfs.7z
